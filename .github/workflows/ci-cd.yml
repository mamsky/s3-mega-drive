name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch:

# PR boleh saling batalkan, tapi push ke main tidak: deploy yang sedang jalan
# dibiarkan selesai supaya container tidak pernah tertinggal setengah jadi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------- 1. uji ----------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build semua entry point
        run: bun build src/server.js src/s3/server.js src/ui/server.js --target=bun --packages=external --outdir=/tmp/build-check

      - name: Smoke test
        run: bun run smoke
        env:
          # Tanpa kredensial MEGA, smoke test tetap menjalankan unit + routing
          # dan melewati uji end-to-end. Isi secret agar E2E ikut jalan.
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          MEGA_2FA: ${{ secrets.MEGA_2FA }}

  # ---------- 2. build & push image ----------
  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tentukan tag
        id: vars
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=ref,event=pr

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          # VPS ARM (mis. Ampere/Hetzner CAX) perlu diubah jadi linux/arm64
          # lewat repository variable BUILD_PLATFORMS.
          platforms: ${{ vars.BUILD_PLATFORMS || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestation tidak dipakai; mematikannya menghilangkan manifest
          # tambahan sehingga pull di VPS sedikit lebih ringan.
          provenance: false
          build-args: |
            BUN_VERSION=1.4.2-alpine

  # ---------- 3. deploy ke VPS ----------
  deploy:
    name: Deploy ke VPS
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.S3_DOMAIN || 's3.pasteprosmana.my.id' }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/srv/apps/s3-mega-drive' }}
      S3_DOMAIN: ${{ vars.S3_DOMAIN || 's3.pasteprosmana.my.id' }}
      GHCR_USER: ${{ github.actor }}
      # Secret disimpan sebagai env job (bukan langsung di `if:`) karena
      # GitHub tidak mengizinkan secrets di dalam ekspresi `if`.
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      # Context `env` tidak boleh dipakai di dalam blok env level job, jadi
      # registry ditulis literal di sini.
      IMAGE_REF: ghcr.io/${{ github.repository }}:${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Login GHCR di VPS
        if: env.GHCR_PAT != ''
        run: |
          # PAT dikirim lewat stdin, bukan argumen, supaya tidak muncul di
          # daftar proses (ps aux) mesin VPS.
          printf '%s' "$GHCR_PAT" | ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Kirim file deploy
        run: |
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$DEPLOY_PATH/deploy'"
          scp -i ~/.ssh/id_deploy -P "$VPS_PORT" \
            docker-compose.yml \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/docker-compose.yml"
          scp -i ~/.ssh/id_deploy -P "$VPS_PORT" \
            deploy/Caddyfile deploy/nginx-s3.conf \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/deploy/"

      - name: Pull, restart, verifikasi, rollback bila gagal
        run: |
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$DEPLOY_PATH' && IMAGE_REF='$IMAGE_REF' bash -s" <<'REMOTE'
          set -euo pipefail

          # .env di VPS tidak pernah ditimpa CI karena berisi kredensial MEGA.
          # CI hanya mengganti baris IMAGE= di dalamnya.
          touch .env
          PREV_IMAGE=$(sed -n 's/^IMAGE=//p' .env | tail -1 || true)

          if grep -q '^IMAGE=' .env; then
            sed -i "s|^IMAGE=.*|IMAGE=$IMAGE_REF|" .env
          else
            printf 'IMAGE=%s\n' "$IMAGE_REF" >> .env
          fi

          echo "==> deploy $IMAGE_REF (sebelumnya: ${PREV_IMAGE:-belum ada})"
          docker compose pull
          docker compose up -d --remove-orphans

          # Port dibaca dari .env karena tiap VPS bisa berbeda; 3001 di VPS ini
          # sudah dipakai 9Router sehingga gateway memakai 3101.
          S3_PORT=$(sed -n 's/^S3_PORT=//p' .env | tail -1)
          S3_PORT=${S3_PORT:-3001}

          healthy() {
            for _ in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:$S3_PORT/__health" || true)
              [ "$code" = "200" ] && return 0
              sleep 3
            done
            return 1
          }

          if ! healthy; then
            echo "==> health check gagal, rollback ke ${PREV_IMAGE:-image lama}" >&2
            docker compose logs --tail 60 s3 >&2 || true
            if [ -n "$PREV_IMAGE" ]; then
              sed -i "s|^IMAGE=.*|IMAGE=$PREV_IMAGE|" .env
              docker compose up -d --remove-orphans
            fi
            exit 1
          fi

          echo "==> container sehat"

          # Setiap deploy menghasilkan tag sha-* baru; tanpa pembersihan ini
          # image lama menumpuk dan menghabiskan disk VPS. Container yang
          # sedang jalan tidak pernah ikut terhapus.
          docker image prune -f >/dev/null
          docker image prune -af --filter "until=72h" >/dev/null
          echo "==> selesai, sisa disk: $(df -h / | awk 'NR==2 {print $4}')"
          REMOTE

      - name: Cek dari internet
        run: |
          # Domain bisa belum punya DNS record (mis. baru disiapkan). Dalam
          # kondisi itu deploy tetap dianggap sukses karena container sudah
          # terbukti sehat di langkah sebelumnya; yang gagal hanya DNS.
          if ! getent hosts "$S3_DOMAIN" >/dev/null 2>&1; then
            echo "::warning::DNS $S3_DOMAIN belum ada, cek publik dilewati"
            exit 0
          fi

          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$S3_DOMAIN/__health" || true)
            if [ "$code" = "200" ]; then
              echo "OK https://$S3_DOMAIN/__health -> 200"
              curl -s "https://$S3_DOMAIN/__health"
              exit 0
            fi
            echo "percobaan $attempt/12: HTTP $code"
            sleep 5
          done
          echo "Health check publik gagal untuk https://$S3_DOMAIN" >&2
          exit 1
