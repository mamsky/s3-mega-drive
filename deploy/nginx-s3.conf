# Reverse proxy S3 gateway untuk VPS yang memakai nginx + Cloudflare Tunnel.
#
# Pasang ke /etc/nginx/sites-available/s3-mega-drive.conf lalu symlink ke
# sites-enabled. Port 3101 harus sama dengan S3_PORT di /srv/apps/s3-mega-drive/.env.
#
# Catatan penting:
# - Header Host diteruskan apa adanya (proxy_set_header Host $host) karena Host
#   ikut ditandatangani klien pada SigV4; mengubahnya membuat signature invalid.
# - proxy_request_buffering off wajib: tanpa ini nginx menampung seluruh body
#   upload ke disk dulu, sehingga upload besar (ratusan MB) menghabiskan disk
#   dan terasa menggantung.
# - Kompresi (gzip) sengaja tidak dipakai: respons S3 bergantung pada
#   Content-Length dan body streaming yang tidak boleh diubah.

server {
    listen 127.0.0.1:80;
    server_name s3.pasteprosmana.my.id;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
